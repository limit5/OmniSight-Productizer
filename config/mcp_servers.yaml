# OP-853 - Remote MCP server catalog overlays for operator-run services.
servers:
  mcp_graphiti:
    url_env: OMNISIGHT_MCP_GRAPHITI_URL
    token_env: OMNISIGHT_MCP_GRAPHITI_TOKEN
    default_url: https://mcp-graphiti.local
    mode: read_only
    # OP-2607: read-only enforcement is an EXACT tool set (MCP_GRAPHITI_READ_ONLY_TOOLS
    # in backend/agents/mcp_integration.py = the temporal_tools below); the old
    # get/find/query/list prefix matching is gone.
    temporal_tools:
      - getTicketTimeline
      - findSimilarPriorTicketsByTimeline
      - getBotSuccessRateByPattern
    ingestion:
      jira_changelog:
        - ticket_status_transitions
        - bot_activity
      gerrit_stream_events:
        - patch_set_created
        - code_review_plus_two
        - change_merged

# OP-2734 — retention for the append-mode log sinks on this host.
#
# copytruncate is REQUIRED, not a preference: these files are systemd
# `StandardOutput=append:` targets and the writing daemons hold the fd open.
# A rename-based rotation would leave them writing to an unlinked inode, i.e.
# the log would silently stop growing while appearing rotated — the same
# looks-fine-isn't failure family this sweep exists to remove.
#
# Context: the host filesystem hit 100% on 2026-07-20 and killed
# pipeline-coordinator with ENOSPC. These sinks were not the cause (2-3 GB
# against 1007 GB) but they were unbounded, which is its own defect.

/home/user/work/sora/logs/coordinator/systemd.log
/home/user/work/sora/logs/bridge/systemd.log
/home/user/work/sora/logs/release-milestone/staging-sync.log
/home/user/work/sora/logs/backup/prod-backup.log
/home/user/work/sora/logs/release-milestone/canary-status.jsonl
{
    copytruncate
    size 20M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    nocreate
}

/home/user/.local/state/omnisight-alerts/run.log
{
    copytruncate
    size 5M
    rotate 3
    compress
    missingok
    notifempty
    nocreate
}

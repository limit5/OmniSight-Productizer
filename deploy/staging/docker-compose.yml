# OP-767 staging compose — mirrors prod topology at smaller scale.
#
# Usage:
#   cp deploy/staging/.env.example deploy/staging/.env  # create locally
#   docker compose -f deploy/staging/docker-compose.yml --env-file deploy/staging/.env up -d
#
# Release-train path:
#   OMNISIGHT_REGISTRY defaults to the GitLab CR project namespace, and
#   OMNISIGHT_IMAGE_TAG is required so staging never falls back to a default tag.
#   RT-05b owns deploy-by-digest; this file remains tag-based for RT-05a.
services:
  postgres:
    # Must match prod (deploy/postgres-ha): the schema requires the pgvector
    # extension (`CREATE EXTENSION vector`); vanilla postgres:16-alpine fails.
    image: omnisight-postgres-pgvector:16-alpine
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-omnisight}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-omnisight_staging}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - staging-postgres:/var/lib/postgresql/data
      - ${STAGING_SANITIZED_BACKUP_DIR:-/var/lib/omnisight/staging/backups}:/backups:ro
    ports:
      - "${STAGING_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-omnisight} -d $${POSTGRES_DB:-omnisight_staging}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 1g
    mem_reservation: 256m

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    restart: always
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - EXEC=1
      - POST=1
      - BUILD=0
      - AUTH=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EVENTS=0
      - INFO=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
      - LOG_LEVEL=warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "2", "http://127.0.0.1:2375/_ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 128m
    mem_reservation: 16m

  backend-a:
    image: ${OMNISIGHT_REGISTRY:-sora.services:49160/omnisight/omnisight-productizer}/backend:${OMNISIGHT_IMAGE_TAG:?OMNISIGHT_IMAGE_TAG must be set}
    pull_policy: always
    build:
      context: ../..
      dockerfile: Dockerfile.backend
    ports:
      - "${STAGING_BACKEND_A_PORT:-8010}:8000"
    volumes:
      - staging-data:/app/data
      - staging-artifacts:/app/.artifacts
      - staging-sdks:/app/.sdks
      # [OP-1606] RT-08 deploy-overlay lock — host dir written by
      # scripts/write_deploy_overlay_lock.py (via scripts/staging_deploy.sh)
      # before bring-up, mounted read-only so the backend reads
      # /etc/omnisight/deploy-overlay.lock once at startup. Default points at a
      # shared dir for the plain `compose up` path (overlay observational);
      # the blue-green deploy exports a per-color OMNISIGHT_DEPLOY_OVERLAY_DIR.
      - ${OMNISIGHT_DEPLOY_OVERLAY_DIR:-/var/lib/omnisight/staging/overlay}:/etc/omnisight:ro
    secrets:
      - staging_audit_verify_token
    environment:
      - OMNISIGHT_DEBUG=false
      - OMNISIGHT_AUTH_MODE=strict
      - OMNISIGHT_ENV=staging
      - OMNISIGHT_INSTANCE_ID=staging-backend-a
      # B1b (OP-1711): the actual running backend image digest, exported by
      # scripts/staging_deploy.sh after post-pull digest verification, so the
      # /readyz overlay-digest gate compares running-vs-lock SUBSTANCE (not just
      # shape). Empty (legacy/no-candidate-bundle path) => gate skips (fail-open),
      # matching the digest-verify + lock-write skips. Enforcement stays gated by
      # OMNISIGHT_ENFORCE_OVERLAY_DIGEST_MATCH (B1a, still default-OFF — soak first).
      - OMNISIGHT_RUNNING_IMAGE_DIGEST_BACKEND=${OMNISIGHT_RUNNING_IMAGE_DIGEST_BACKEND:-}
      - OMNISIGHT_STAGING_AUDIT_VERIFY_TOKEN_FILE=/run/secrets/staging_audit_verify_token
      - OMNISIGHT_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-omnisight}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-omnisight_staging}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-omnisight}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-omnisight_staging}
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - OMNISIGHT_FRONTEND_URL=http://frontend:3000
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /app/.agent_workspaces:uid=65532,gid=65532
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # [OP-1725] `backend` network alias. The released frontend image bakes its
    # Next.js /api rewrite to the Dockerfile.frontend default http://backend:8000
    # (staging pulls a prebuilt image via pull_policy: always, so the compose
    # build-arg BACKEND_URL=http://caddy never applies to the running container).
    # Aliasing backend-a as `backend` makes that baked SSR-rewrite host resolve
    # without a CI rebuild. Browser /api traffic does NOT use this path — it goes
    # browser → caddy(:18080) → backend-a/backend-b.
    networks:
      default:
        aliases:
          - backend
    mem_limit: 2g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend-b:
    image: ${OMNISIGHT_REGISTRY:-sora.services:49160/omnisight/omnisight-productizer}/backend:${OMNISIGHT_IMAGE_TAG:?OMNISIGHT_IMAGE_TAG must be set}
    pull_policy: always
    build:
      context: ../..
      dockerfile: Dockerfile.backend
    command:
      - "sh"
      - "-c"
      - "WORKERS=$${OMNISIGHT_WORKERS:-1}; exec python -m uvicorn backend.main:app --host 0.0.0.0 --port 8001 --workers $$WORKERS --no-access-log"
    ports:
      - "${STAGING_BACKEND_B_PORT:-8011}:8001"
    volumes:
      - staging-data:/app/data
      - staging-artifacts:/app/.artifacts
      - staging-sdks:/app/.sdks
      # [OP-1606] RT-08 deploy-overlay lock — see backend-a for the contract.
      - ${OMNISIGHT_DEPLOY_OVERLAY_DIR:-/var/lib/omnisight/staging/overlay}:/etc/omnisight:ro
    secrets:
      - staging_audit_verify_token
    environment:
      - OMNISIGHT_DEBUG=false
      - OMNISIGHT_AUTH_MODE=strict
      - OMNISIGHT_ENV=staging
      - OMNISIGHT_INSTANCE_ID=staging-backend-b
      # B1b (OP-1711): see backend-a — the running backend digest the /readyz
      # overlay-digest gate compares against the RT-08 lock. Empty => gate skips.
      - OMNISIGHT_RUNNING_IMAGE_DIGEST_BACKEND=${OMNISIGHT_RUNNING_IMAGE_DIGEST_BACKEND:-}
      - OMNISIGHT_STAGING_AUDIT_VERIFY_TOKEN_FILE=/run/secrets/staging_audit_verify_token
      - OMNISIGHT_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-omnisight}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-omnisight_staging}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-omnisight}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-omnisight_staging}
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - OMNISIGHT_FRONTEND_URL=http://frontend:3000
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /app/.agent_workspaces:uid=65532,gid=65532
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: always
    # [OP-1725] Canonical staging URL is same-origin http://<host>:18080
    # (STAGING_HTTP_PORT → :80). caddy.json routes /api,/audit,/readyz,/healthz,
    # /health to backend-a/backend-b and everything else (the UI) to frontend:3000,
    # so the host is fully browsable on this one port. NOTE: staging caddy must
    # NOT bind host :443 — prod's caddy owns it; the :443 publish below maps to a
    # high host port (STAGING_HTTPS_PORT, default 8443), never the host's 443.
    ports:
      - "${STAGING_HTTP_PORT:-18080}:80"
      - "${STAGING_HTTPS_PORT:-8443}:443"
    volumes:
      - ./caddy.json:/etc/caddy/caddy.json:ro
      - staging-caddy-data:/data
      - staging-caddy-config:/config
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    environment:
      - STAGING_HOSTNAME=${STAGING_HOSTNAME:-staging.sora.services}
    depends_on:
      backend-a:
        condition: service_healthy
      backend-b:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    mem_limit: 512m
    mem_reservation: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "2", "http://localhost/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ${OMNISIGHT_REGISTRY:-sora.services:49160/omnisight/omnisight-productizer}/frontend:${OMNISIGHT_IMAGE_TAG:?OMNISIGHT_IMAGE_TAG must be set}
    pull_policy: always
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
      args:
        BACKEND_URL: http://caddy
        # [OP-1725] Do NOT bake an absolute API host. The client bundle
        # (lib/api.ts) falls back to relative /api/v1 when NEXT_PUBLIC_API_URL
        # is unset, which is what same-origin staging wants (browser → caddy
        # → backend). Re-hardcoding staging.sora.services here would break the
        # SSR flag bootstrap (lib/feature-flags-ssr.ts) since that host does
        # not resolve in this env. Left empty intentionally.
        NEXT_PUBLIC_API_URL: ""
        VITE_API_BASE: ""
    ports:
      - "${STAGING_FRONTEND_PORT:-3010}:3000"
    environment:
      - BACKEND_URL=http://caddy
      # [OP-1725] Same-origin staging. Empty NEXT_PUBLIC_API_URL so SSR
      # (lib/feature-flags-ssr.ts resolveServerApiBase) uses the request Host
      # header instead of an unresolvable absolute host, and the client uses
      # the relative /api/v1 baked into lib/api.ts. Browser path is
      # browser → caddy(:18080) → backend; the Next /api rewrite is only the
      # SSR fallback (resolved via the `backend` alias on backend-a below).
      - NEXT_PUBLIC_API_URL=
      - VITE_API_BASE=
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=1024
      - OMNISIGHT_FRONTEND_BUILD_COMMIT=${OMNISIGHT_IMAGE_TAG:?OMNISIGHT_IMAGE_TAG must be set}
      - OMNISIGHT_MASTER_HEAD_COMMIT=${OMNISIGHT_IMAGE_TAG:?OMNISIGHT_IMAGE_TAG must be set}
      - OMNISIGHT_FRONTEND_BUILD_LAG_COMMITS=0
    depends_on:
      caddy:
        condition: service_healthy
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bridge-daemon:
    image: ${OMNISIGHT_REGISTRY:-sora.services:49160/omnisight/omnisight-productizer}/backend:${OMNISIGHT_IMAGE_TAG:?OMNISIGHT_IMAGE_TAG must be set}
    profiles: ["bridge"]
    pull_policy: always
    build:
      context: ../..
      dockerfile: Dockerfile.backend
    command:
      - "python"
      - "scripts/run_gerrit_jira_bridge.py"
      - "--agent-class"
      - "${STAGING_BRIDGE_AGENT_CLASS:-subscription-claude}"
    environment:
      - OMNISIGHT_ENV=staging
      - OMNISIGHT_GERRIT_ENABLED=${STAGING_GERRIT_ENABLED:-true}
      - OMNISIGHT_GERRIT_URL=${STAGING_GERRIT_URL:-https://staging.sora.services:29420}
      - OMNISIGHT_GERRIT_PROJECT=${STAGING_GERRIT_PROJECT:-omnisight/OmniSight-Productizer}
      - OMNISIGHT_GIT_SSH_KEY_PATH=${STAGING_GIT_SSH_KEY_PATH:-/run/secrets/staging_gerrit_ssh_key}
    env_file:
      - path: .env
        required: false
    secrets:
      - staging_gerrit_ssh_key
    depends_on:
      backend-a:
        condition: service_healthy
    restart: always
    mem_limit: 512m
    mem_reservation: 128m

secrets:
  staging_audit_verify_token:
    file: ${STAGING_AUDIT_VERIFY_TOKEN_FILE:-/home/user/.config/omnisight/staging-audit-verify-token}
  staging_gerrit_ssh_key:
    file: ${STAGING_GERRIT_SSH_KEY_FILE:-/home/user/.config/omnisight/gerrit-claude-bot-ed25519}

volumes:
  staging-postgres:
    driver: local
  staging-data:
    driver: local
  staging-artifacts:
    driver: local
  staging-sdks:
    driver: local
  staging-caddy-data:
    driver: local
  staging-caddy-config:
    driver: local

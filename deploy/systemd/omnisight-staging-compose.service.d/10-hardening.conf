# 2026-08-13 incident follow-up — same rationale as the prod twin:
# poll the system docker daemon (cross-manager After= is a no-op; this unit
# died <1s into boot on 2026-08-13 because dockerd came up 78s later), and
# alert on failure. NOTE: while the staging .env still carries the prod
# Anthropic key (leg-2 calibration residue), the env-contract guard will fail
# this unit at every boot BY DESIGN — with this drop-in that now files a JIRA
# alert instead of failing silently. Resolve by minting a staging key or
# removing the residue after the leg-2 soak.
[Unit]
OnFailure=omnisight-alert@%n.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do docker info >/dev/null 2>&1 && exit 0; sleep 2; done; echo "docker daemon not ready after 120s" >&2; exit 1'
TimeoutStartSec=600

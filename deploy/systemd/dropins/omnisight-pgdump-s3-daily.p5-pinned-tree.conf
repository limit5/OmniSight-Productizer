# OP-2731 P5. This lane executed from %h/work/sora/OmniSight-Productizer — the
# operator's dirty checkout (735 dirty paths), whose backup_dlp_scan.py predates
# the reviewed-digest allowlist entirely. Wiring the DLP gate (P1) against that
# copy would have blocked the upload every night, on the one lane that kept a DR
# posture alive during the four-night outage.
#
# Moving WorkingDirectory alone would have changed nothing: ExecStart is an
# absolute path into the same tree. Both move together, to the release-pinned
# checkout that prod actually runs.
[Service]
WorkingDirectory=/home/user/omnisight-prod
ExecStart=
ExecStart=/bin/bash /home/user/omnisight-prod/scripts/backup_postgres_daily_dockerized.sh
# F1 needs the gpg passphrase, which backup.env does not carry. backup-dr.env
# holds ONLY the passphrase — which is also why lane A's compose interpolation
# works and this lane's would not, if it used compose (see P1).
EnvironmentFile=-/home/user/.config/omnisight/backup-dr.env

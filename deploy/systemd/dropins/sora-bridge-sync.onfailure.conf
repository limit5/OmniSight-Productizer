# OP-2739: this unit reported Result=success EVERY DAY while its tree sat 240
# commits behind with a dirty worktree, and was listed expected=yes in the
# deployment-audit manifest. Making it fail honestly (dirty_and_stale, exit 4)
# is only half the fix -- without OnFailure the new red is as unheard as the old
# green was untrue.
[Unit]
OnFailure=omnisight-alert@%n.service

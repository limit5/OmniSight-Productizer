# OP-2731: this unit had NO OnFailure= at all. During 2026-07-22..26 the
# encrypted lane was blocked for four nights and THESE two lanes were the only
# reason any backup existed — while being the only two that could not report
# their own failure. Mirrors omnisight-prod-backup.service.d/onfailure.conf.
[Unit]
OnFailure=omnisight-alert@%n.service

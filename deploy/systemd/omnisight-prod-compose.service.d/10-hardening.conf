# 2026-08-13 incident follow-up.
# A user unit cannot order After= the SYSTEM manager's docker.service (the name
# doesn't resolve across managers), so at boot this unit raced the daemon.
# The pre-step polls the daemon instead of trusting ordering. OnFailure routes
# any bring-up failure into the proven JIRA alert channel (OP-2728) — this
# unit failing silently is how a 1-replica boot went unnoticed.
[Unit]
OnFailure=omnisight-alert@%n.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do docker info >/dev/null 2>&1 && exit 0; sleep 2; done; echo "docker daemon not ready after 120s" >&2; exit 1'
# boot bring-up measured 254s on 2026-08-13 (registry pulls); 300 was borderline.
TimeoutStartSec=600

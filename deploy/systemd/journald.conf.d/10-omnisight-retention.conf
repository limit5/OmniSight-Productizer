# 2026-08-13 incident follow-up: the journal held only 2 boots, so the
# evidence of WHY backend-a stopped on 2026-08-06 was already gone by the
# time anyone investigated. Persistent storage is already on; raise the caps
# so forensics survive multi-week gaps between incidents.
[Journal]
SystemMaxUse=6G
MaxRetentionSec=60day

# Printing skill pack — task template.
#
# OP-1804 (B2, 1D): migrated from the legacy id/name/outputs schema to the
# embedded planner schema (task_id + expected_output) so the embedded planner
# can consume it without a KeyError. This is a SCHEMA-ONLY migration: task
# content/intent and stub maturity are unchanged. Making these tasks real is a
# separate, later track.
schema_version: 1
tasks:
  - task_id: print_ipp_setup
    name: "Configure IPP/CUPS Backend"
    description: "Set up IPP printer discovery, capability negotiation, and CUPS backend filter"
    expected_output: build/printing/ipp_cups_backend_config.json
    estimated_minutes: 30

  - task_id: print_pcl_interpreter
    name: "PCL Interpreter Setup"
    description: "Configure PCL 5e/5c/6-XL interpreter for raster-to-PCL conversion"
    expected_output: build/printing/pcl_output_stream.pcl
    estimated_minutes: 45

  - task_id: print_ps_interpreter
    name: "PostScript Interpreter Setup"
    description: "Configure PostScript Level 2/3 generator with DSC compliance"
    expected_output: build/printing/postscript_output.ps
    estimated_minutes: 45

  - task_id: print_ghostscript_config
    name: "Ghostscript PDF Rendering"
    description: "Configure Ghostscript devices for PDF → raster/PDL conversion"
    expected_output: build/printing/gs_render_output.tar.gz
    estimated_minutes: 30

  - task_id: print_color_profiling
    name: "Color Profile Configuration"
    description: "Assign ICC profiles per paper type and ink combination"
    expected_output: build/printing/icc_print_profile_assignment.json
    estimated_minutes: 60

  - task_id: print_icc_generation
    name: "ICC Profile Generation"
    description: "Generate printer-specific ICC v4 output profiles"
    expected_output: build/printing/icc_print_profile.icc
    estimated_minutes: 30

  - task_id: print_queue_setup
    name: "Print Queue Configuration"
    description: "Configure spooler, queue policies, and job lifecycle"
    expected_output: build/printing/print_queue_test_report.xml
    estimated_minutes: 30

  - task_id: print_duplex_test
    name: "Duplex Print Verification"
    description: "Verify correct page ordering and duplex commands in PCL/PS output"
    expected_output: build/printing/duplex_print_test_report.xml
    estimated_minutes: 20

  - task_id: print_roundtrip_test
    name: "PDF → Raster → PDL Round-trip Test"
    description: "End-to-end verification: PDF rendered to raster, encoded to PCL/PS, checksums compared"
    expected_output: build/printing/pdf_raster_pdl_roundtrip_report.xml
    estimated_minutes: 45

  - task_id: print_integration_test
    name: "Full Pipeline Integration Test"
    description: "IPP submit → spooler → GS render → PDL encode → color managed output"
    expected_output: build/printing/full_pipeline_integration_report.xml
    estimated_minutes: 90

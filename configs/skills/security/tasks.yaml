# Security skill pack — task template.
#
# OP-1809 (B2, 1D-rest): migrated from the legacy id/name/artifacts schema
# to the embedded planner schema (task_id + expected_output), following the
# OP-1786 imaging pattern. This is a SCHEMA-ONLY migration: task
# content/intent, depends_on edges, and stub maturity are unchanged.
schema_version: 1
tasks:
  # -- Secure boot chain tasks --
  - task_id: sec-boot-chain-setup
    name: "Secure boot chain configuration"
    description: "Configure secure boot chain for target SoC — key fusing, bootloader signing, dm-verity setup"
    required_tier: t3
    toolchain: platform-specific
    when:
      security_secure_boot: true
    depends_on: []
    expected_output: build/security/secure_boot_chain_config.json

  - task_id: sec-boot-bl2-sign
    name: "BL2 bootloader signing"
    description: "Sign BL2 trusted bootloader with root key or sub-key"
    required_tier: t1
    toolchain: cmake
    when:
      security_secure_boot: true
    depends_on:
      - sec-boot-chain-setup
    expected_output: build/security/bl2_signed.bin

  - task_id: sec-boot-kernel-sign
    name: "Kernel image signing"
    description: "Sign kernel FIT image for U-Boot verified boot"
    required_tier: t1
    toolchain: cmake
    when:
      security_secure_boot: true
    depends_on:
      - sec-boot-chain-setup
    expected_output: build/security/kernel_signed.itb

  - task_id: sec-boot-rootfs-verity
    name: "dm-verity rootfs setup"
    description: "Generate dm-verity hash tree for read-only rootfs"
    required_tier: t1
    toolchain: cmake
    when:
      security_secure_boot: true
    depends_on:
      - sec-boot-kernel-sign
    expected_output: build/security/rootfs.verity

  - task_id: sec-boot-rollback-counter
    name: "Anti-rollback counter setup"
    description: "Configure OTP/TPM monotonic counter for rollback protection"
    required_tier: t3
    toolchain: hardware-daemon-rpc
    when:
      security_secure_boot: true
    depends_on:
      - sec-boot-chain-setup
    expected_output: build/security/rollback_counter_config.json

  # -- TEE binding tasks --
  - task_id: sec-tee-optee-build
    name: "OP-TEE OS build"
    description: "Build OP-TEE OS for target platform with secure boot integration"
    required_tier: t1
    toolchain: cmake
    when:
      security_tee: true
    depends_on:
      - sec-boot-chain-setup
    expected_output: build/security/tee_binding.c

  - task_id: sec-tee-ta-scaffold
    name: "Trusted Application scaffold"
    description: "Generate TA skeleton with session management, secure storage, crypto"
    required_tier: t1
    toolchain: cmake
    when:
      security_tee: true
    depends_on:
      - sec-tee-optee-build
    expected_output: build/security/ta_template.c

  - task_id: sec-tee-ca-client
    name: "Client Application TEE interface"
    description: "Normal world CA library for invoking TA commands"
    required_tier: t1
    toolchain: cmake
    when:
      security_tee: true
    depends_on:
      - sec-tee-ta-scaffold
    expected_output: build/security/tee_ca_client.c

  - task_id: sec-tee-secure-storage
    name: "TEE secure storage integration"
    description: "Persistent object storage via TEE trusted storage API"
    required_tier: t1
    toolchain: cmake
    when:
      security_tee: true
    depends_on:
      - sec-tee-ta-scaffold
    expected_output: build/security/tee_secure_storage.c

  # -- Remote attestation tasks --
  - task_id: sec-attest-tpm-init
    name: "TPM initialization"
    description: "Initialize TPM hierarchy, create attestation key (AK)"
    required_tier: t3
    toolchain: hardware-daemon-rpc
    when:
      security_attestation: true
    depends_on: []
    expected_output: build/security/remote_attestation.c

  - task_id: sec-attest-pcr-extend
    name: "PCR measurement chain"
    description: "Extend PCRs at each boot stage for measured boot"
    required_tier: t1
    toolchain: cmake
    when:
      security_attestation: true
    depends_on:
      - sec-attest-tpm-init
      - sec-boot-chain-setup
    expected_output: build/security/pcr_measurement_chain.json

  - task_id: sec-attest-quote-gen
    name: "Attestation quote generation"
    description: "Generate signed TPM quote with nonce for remote verifier"
    required_tier: t1
    toolchain: cmake
    when:
      security_attestation: true
    depends_on:
      - sec-attest-pcr-extend
    expected_output: build/security/attestation_quote.bin

  - task_id: sec-attest-verify-service
    name: "Remote attestation verification service"
    description: "Server-side verifier for TPM quotes against known-good values"
    required_tier: t1
    toolchain: cmake
    when:
      security_attestation: true
    depends_on:
      - sec-attest-quote-gen
    expected_output: build/security/attestation_verifier_service.py

  # -- SBOM signing tasks --
  - task_id: sec-sbom-generate
    name: "SBOM generation"
    description: "Generate SPDX/CycloneDX SBOM from build artifacts"
    required_tier: t1
    toolchain: cmake
    when:
      security_sbom: true
    depends_on: []
    expected_output: build/security/sbom.spdx.json

  - task_id: sec-sbom-sign
    name: "SBOM signing with cosign"
    description: "Sign SBOM with cosign (keyless or key-pair mode)"
    required_tier: t1
    toolchain: cmake
    when:
      security_sbom: true
    depends_on:
      - sec-sbom-generate
    expected_output: build/security/sbom.spdx.json.sig

  - task_id: sec-sbom-verify
    name: "SBOM signature verification"
    description: "Verify SBOM signature and check transparency log entry"
    required_tier: t1
    toolchain: cmake
    when:
      security_sbom: true
    depends_on:
      - sec-sbom-sign
    expected_output: build/security/sbom_verify_report.json

  # -- Threat model tasks --
  - task_id: sec-threat-model-generate
    name: "Threat model generation"
    description: "Generate STRIDE threat model for product class"
    required_tier: t1
    toolchain: custom
    when:
      security_threat_model: true
    depends_on: []
    expected_output: build/security/threat_model.json

  - task_id: sec-threat-coverage-eval
    name: "Threat coverage evaluation"
    description: "Evaluate mitigation coverage against threat model"
    required_tier: t1
    toolchain: custom
    when:
      security_threat_model: true
    depends_on:
      - sec-threat-model-generate
    expected_output: build/security/threat_coverage_report.json

  # -- Integration test tasks --
  - task_id: sec-integration-boot-verify
    name: "Boot chain end-to-end verification"
    description: "Flash signed image, verify each boot stage passes signature check"
    required_tier: t3
    toolchain: hardware-daemon-rpc
    when:
      security_secure_boot: true
    depends_on:
      - sec-boot-rootfs-verity
      - sec-boot-rollback-counter
    expected_output: build/security/boot_chain_verification_report.json

  - task_id: sec-integration-full-stack
    name: "Full security stack test"
    description: "End-to-end test: secure boot → TEE session → attestation quote → SBOM verify"
    required_tier: t3
    toolchain: hardware-daemon-rpc
    when:
      security_secure_boot: true
    depends_on:
      - sec-boot-rootfs-verity
      - sec-tee-secure-storage
      - sec-attest-quote-gen
      - sec-sbom-verify
    expected_output: build/security/full_stack_test_report.json

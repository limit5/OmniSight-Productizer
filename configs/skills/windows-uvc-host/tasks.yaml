# OP-1815 (skeleton) + OP-1817 (B-1 Case-2 content) — Windows UVC HOST
# app DAG.
#
# Describes the Windows desktop UVC-host app build. All three tasks route
# through the dispatcher (scripts/scaffold.py) to backend.tauri_scaffolder
# — NO new Windows scaffolder. The UVC enumerate + capture domain
# templates now ship in this pack's scaffolds/ overlay (OP-1817); the
# dispatcher layers them on top of the borrowed desktop-tauri skeleton, so
# one render produces the full host project (skeleton + enumerate +
# capture). The two domain tasks are now active and keep the same DAG
# ordering they carried as follow-ons.

tasks:
  - id: windows-uvc-host-scaffold-init
    name: "Scaffold Windows UVC host desktop skeleton"
    description: >
      Render the base desktop Tauri 2.x app project by dispatching to the
      existing desktop-tauri scaffolder (backend.tauri_scaffolder via
      scripts/scaffold.py - NO new Windows scaffolder). This is the
      Windows UVC HOST app shell that the camera enumeration, capture, and
      preview layers below build on. Idempotent: re-renders without
      clobbering files outside the scaffold surface.
    depends_on: []
    artifacts: [tauri_skeleton]
    estimated_hours: 1
    framework_gate: x2-role-desktop-tauri
    status: active

  - id: windows-uvc-host-enumeration
    name: "UVC camera enumeration"
    description: >
      Render the UVC enumeration layer onto the skeleton: the
      platform-agnostic device model (UvcDevice / UvcFormat / FrameSize)
      and the UvcEnumerator trait that lists attached USB Video Class
      capture devices behind a backend-swappable boundary (Media
      Foundation on Windows; NullEnumerator is the scaffold default).
      Templates live in this pack's scaffolds/ overlay
      (src-tauri/src/uvc/device.rs); the dispatcher renders them on top of
      the borrowed desktop-tauri skeleton — NO new Windows scaffolder.
    depends_on: [windows-uvc-host-scaffold-init]
    artifacts: [uvc_host_enumeration]
    estimated_hours: 3
    framework_gate: x2-role-desktop-tauri
    status: active

  - id: windows-uvc-host-capture
    name: "UVC host capture + IPC"
    description: >
      Render the UVC capture layer onto the skeleton: the pixel-format +
      frame-geometry model, the lifecycle-correct capture state machine
      (CaptureLifecycle: idle→running→stopped), and the Tauri IPC commands
      (uvc_enumerate / uvc_start_capture / uvc_stop_capture /
      uvc_capture_status) bridged to a typed frontend client (src/uvc.ts).
      This is host/consumer-side capture from an attached UVC device, not
      the device-side `uvc` gadget pack. Templates live in this pack's
      scaffolds/ overlay (src-tauri/src/uvc/{capture,commands}.rs,
      src/uvc.ts); the dispatcher renders them on top of the skeleton — NO
      new Windows scaffolder.
    depends_on: [windows-uvc-host-enumeration]
    artifacts: [uvc_host_capture]
    estimated_hours: 4
    framework_gate: x2-role-desktop-tauri
    status: active

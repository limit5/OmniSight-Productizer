# OP-1815 (skeleton) + OP-1817 (B-1 Case-2 content) - Windows UVC HOST
# app pack.
#
# NAMING TRAP: the existing `uvc` pack is device-side (USB gadget). This
# pack is the HOST / consumer side: a Windows desktop app that enumerates
# and captures from a UVC camera.
#
# The dispatcher routes this pack to the existing desktop-tauri scaffolder
# (backend.tauri_scaffolder via backend/skill_registry.py). Rendering this
# pack produces the standard cross-platform Tauri desktop app skeleton
# (covering Windows through the desktop-tauri pack rather than a new
# Windows-specific scaffolder) with this pack's scaffolds/ overlay layered
# on top — the UVC enumerate + capture domain (OP-1817).

schema_version: 1
name: windows-uvc-host
description: >
  Case-2 Windows UVC HOST desktop app pack - a Windows desktop application
  that enumerates and captures from a USB Video Class camera. Reuses the
  existing desktop-tauri scaffolder (on ScaffolderBase) via the dispatcher
  to render the base Tauri desktop app project, with this pack's scaffolds/
  overlay adding the UVC enumerate + capture domain (device model +
  enumerator boundary, capture-lifecycle state machine, Tauri IPC commands,
  and a typed frontend client). No new Windows scaffolder.
version: "0.2.0"
author: "OmniSight"
license: "Apache-2.0"

compatible_socs: []

# Reuses the desktop-tauri pack; declared so the dependency on the Tauri
# templates + backend.tauri_scaffolder module is explicit.
depends_on_skills:
  - skill-desktop-tauri

depends_on_core:
  - CORE-05  # skill pack framework

artifacts:
  - kind: tasks
    path: tasks.yaml
  - kind: scaffolds
    path: scaffolds
  - kind: tests
    path: tests
  - kind: hil
    path: hil
  - kind: docs
    path: docs

hooks:
  install: ""
  validate: ""
  enumerate: ""

keywords:
  - windows
  - uvc
  - usb-video-class
  - camera-host
  - capture-host
  - desktop
  - tauri
  - tauri-2
  - desktop-tauri
  - host
  - consumer
  - enumerate
  - capture
  - case-2

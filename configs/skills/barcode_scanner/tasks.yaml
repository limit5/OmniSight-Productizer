# Barcode Scanner SDK — DAG task definitions.
#
# OP-1801 (Track B, B-2 1D-rest): migrated from the legacy id/name/artifacts
# schema to the embedded planner schema (task_id + expected_output) so the
# embedded planner can consume it without a KeyError. This is a SCHEMA-ONLY
# migration following the OP-1786 (imaging) reference pattern: task
# content/intent, depends_on edges, and the stub maturity are unchanged.
# The pack is still a stub (see docs/product/skill-pack-maturity-matrix.md);
# making these tasks real ("make-real") is a separate, later track.
schema_version: "1"
skill_id: barcode_scanner

tasks:
  - task_id: barcode_scanner_interface
    name: "Unified BarcodeScanner Interface"
    description: "Implement abstract BarcodeScanner base class with connect/disconnect/configure/scan lifecycle"
    depends_on: []
    expected_output: build/barcode_scanner/barcode_scanner_interface.py

  - task_id: vendor_adapters
    name: "Vendor Adapter Implementations"
    description: "Implement Zebra SNAPI, Honeywell, Datalogic, and Newland adapters"
    depends_on: [barcode_scanner_interface]
    expected_output: build/barcode_scanner/vendor_adapters.py

  - task_id: symbology_support
    name: "Symbology Support"
    description: "Implement 1D (UPC/EAN/Code128/Code39/Codabar/I2of5) and 2D (QR/DataMatrix/PDF417/Aztec) decode + validation"
    depends_on: [barcode_scanner_interface]
    expected_output: build/barcode_scanner/symbology_config.yaml

  - task_id: decode_modes
    name: "Decode Mode Support"
    description: "Implement HID wedge, Bluetooth SPP, and native API decode modes with output formatting"
    depends_on: [vendor_adapters]
    expected_output: build/barcode_scanner/decode_modes.py

  - task_id: rest_endpoints
    name: "REST API Endpoints"
    description: "FastAPI router for scanner management, decoding, and testing"
    depends_on: [vendor_adapters, decode_modes]
    expected_output: build/barcode_scanner/routers_barcode_scanner.py

  - task_id: unit_tests
    name: "Unit Test Suite"
    description: "Comprehensive tests with pre-captured frame samples"
    depends_on: [rest_endpoints]
    expected_output: build/barcode_scanner/unit_test_report.xml

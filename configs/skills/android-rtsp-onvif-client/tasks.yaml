# OP-1799 (skeleton) + OP-1814 (B-1 content) — Case-1 Android RTSP/ONVIF
# CLIENT app DAG.
#
# Describes the client-app build. All three tasks route through the
# dispatcher (scripts/scaffold.py) to backend.android_scaffolder — NO new
# scaffolder. The ONVIF-discovery + RTSP-playback client templates now
# ship in this pack's scaffolds/ overlay (OP-1814); the dispatcher layers
# them on top of the borrowed Android skeleton, so one render produces the
# full client project (skeleton + ONVIF + RTSP). The two layer tasks are
# `status: active` and carry the same DAG ordering they always had.

tasks:
  - id: android-rtsp-onvif-scaffold-init
    name: "Scaffold Android client app skeleton"
    description: >
      Render the base Android (Jetpack Compose + Gradle 8 + Kotlin 2.0)
      app project by dispatching to the existing `android` scaffolder
      (backend.android_scaffolder via scripts/scaffold.py — NO new
      scaffolder). This is the CLIENT app shell that the ONVIF discovery
      and RTSP playback layers below build on. Idempotent: re-renders
      without clobbering files outside the scaffold surface.
    depends_on: []
    artifacts: [android_skeleton]
    estimated_hours: 1
    framework_gate: p0-platform-profile
    status: active

  - id: android-onvif-discovery
    name: "ONVIF / WS-Discovery camera discovery"
    description: >
      Render the ONVIF discovery layer onto the skeleton: the
      WS-Discovery multicast probe (WsDiscoveryClient) that enumerates IP
      cameras on the LAN, plus the Device/Media SOAP client
      (OnvifMediaClient) that resolves each camera's RTSP stream URI
      (GetProfiles → GetStreamUri, WS-Security UsernameToken digest auth).
      Templates live in this pack's scaffolds/ overlay (com.omnisight.
      pilot.onvif); the dispatcher renders them on top of the borrowed
      Android skeleton — no new scaffolder.
    depends_on: [android-rtsp-onvif-scaffold-init]
    artifacts: [android_onvif]
    estimated_hours: 3
    framework_gate: p0-platform-profile
    status: active

  - id: android-rtsp-playback
    name: "RTSP stream playback client"
    description: >
      Render the RTSP playback layer onto the skeleton: a Media3/ExoPlayer
      RTSP playback controller (RtspPlaybackController) and a Compose
      player screen (RtspPlayerScreen) that plays a stream URI discovered
      via ONVIF, with lifecycle-correct connect/teardown
      (DisposableEffect). Templates live in this pack's scaffolds/ overlay
      (com.omnisight.pilot.rtsp); the dispatcher renders them on top of
      the skeleton — no new scaffolder.
    depends_on: [android-onvif-discovery]
    artifacts: [android_rtsp_playback]
    estimated_hours: 4
    framework_gate: p4-role-android-kotlin
    status: active

# OP-1816 (skeleton) + OP-1820 (B-1 content) — Case-3 iOS map-AR app DAG.
#
# Describes the ARKit + MapKit app build. All three tasks route through the
# dispatcher (scripts/scaffold.py) to backend.ios_scaffolder — NO new
# scaffolder. The MapKit + ARKit templates ship in this pack's scaffolds/
# overlay (OP-1820); the dispatcher layers them on top of the borrowed iOS
# skeleton, so one render produces the full map-AR project.

tasks:
  - id: ios-map-ar-scaffold-init
    name: "Scaffold iOS map-AR app skeleton"
    description: >
      Render the base iOS (SwiftUI + Swift Package Manager) app project by
      dispatching to the existing `ios` scaffolder (backend.ios_scaffolder
      via scripts/scaffold.py — NO new scaffolder). This is the app shell
      that the ARKit and MapKit layers below build on. Idempotent:
      re-renders without clobbering files outside the scaffold surface.
    depends_on: []
    artifacts: [ios_skeleton]
    estimated_hours: 1
    framework_gate: p0-platform-profile
    status: active

  - id: ios-mapkit-map-view
    name: "MapKit map view + CoreLocation"
    description: >
      Render the MapKit surface onto the skeleton: a SwiftUI `Map` view
      with selectable markers, plus CoreLocation authorization and the
      user's location feed that the AR layer anchors to. The Info.plist
      overlay adds `NSLocationWhenInUseUsageDescription`. Templates live in
      this pack's scaffolds/ overlay; the dispatcher renders them on top of
      the borrowed iOS skeleton — no new scaffolder.
    depends_on: [ios-map-ar-scaffold-init]
    artifacts: [ios_mapkit]
    estimated_hours: 3
    framework_gate: p4-role-ios-swift
    status: active

  - id: ios-arkit-ar-view
    name: "ARKit / RealityKit AR view"
    description: >
      Render the ARKit surface onto the skeleton: a RealityKit `ARView`
      with a world-tracking session that places AR marker entities anchored
      to the points of interest selected in the MapKit layer, including
      session pause on dismantle. The Info.plist overlay adds
      `NSCameraUsageDescription`. Templates live in this pack's scaffolds/
      overlay; the dispatcher renders them on top of the skeleton — no new
      scaffolder.
    depends_on: [ios-mapkit-map-view]
    artifacts: [ios_arkit]
    estimated_hours: 4
    framework_gate: p4-role-ios-swift
    status: active

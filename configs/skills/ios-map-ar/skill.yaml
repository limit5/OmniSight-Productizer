# OP-1816 (skeleton) + OP-1820 (B-1 content) — Case-3 iOS map-AR app pack.
#
# An iOS app that combines ARKit (augmented reality) with MapKit (maps) —
# e.g. an AR wayfinding / points-of-interest experience anchored to a map.
#
# The pack ships no scaffolder of its own: the
# dispatcher (scripts/scaffold.py) routes it to the existing
# backend.ios_scaffolder via the explicit override in
# backend/skill_registry.py (_SCAFFOLDER_MODULE_OVERRIDES). Rendering this
# pack produces the standard iOS app skeleton (SwiftUI + SPM), then layers
# this pack's ARKit + MapKit scaffolds/ overlay on top.
#
# Safe-local internal dev — authored under omnisight-self, NOT a customer
# run. Needs no platform/sandbox. (Note: an actual iOS BUILD needs a macOS
# host — that is J2 infra, out of scope for this skeleton ticket.)

schema_version: 1
name: ios-map-ar
description: >
  Case-3 iOS map-AR app pack — an iOS application that combines ARKit
  (augmented reality) with MapKit (maps), e.g. an AR points-of-interest /
  wayfinding experience that anchors AR content to map locations.
  Reuses the `ios` scaffolder (on ScaffolderBase) via the dispatcher to
  render the base iOS app project (SwiftUI + Swift Package Manager), then
  layers this pack's ARKit (ARView / world tracking) and MapKit (Map view /
  location) domain scaffolds and glue code on top — NO new scaffolder.
version: "0.1.0"
author: "OmniSight"
license: "Apache-2.0"

compatible_socs: []

# Reuses the ios scaffolder; declared so the dependency on the skill-ios
# pack (templates + scaffolder module) is explicit.
depends_on_skills:
  - skill-ios

depends_on_core:
  - CORE-05  # skill pack framework

artifacts:
  - kind: tasks
    path: tasks.yaml
  - kind: scaffolds
    path: scaffolds
  - kind: tests
    path: tests
  - kind: hil
    path: hil
  - kind: docs
    path: docs

hooks:
  install: ""
  validate: ""
  enumerate: ""

keywords:
  - ios
  - swift
  - swiftui
  - arkit
  - augmented-reality
  - ar
  - mapkit
  - maps
  - corelocation
  - realitykit
  - swift-package-manager
  - case-3

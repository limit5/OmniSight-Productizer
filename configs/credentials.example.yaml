# OmniSight Credential Expiry Inventory (OP-727)
#
# Tracks credentials whose loss/expiry would silently break the platform —
# JIRA tokens, Gerrit HTTP passwords, SSH keys, third-party API keys,
# encryption keys. The daily `scripts/credential_expiry_check.py` reads
# this file and alerts at days_until_expiry = 30 / 7 / 1.
#
# Copy to `configs/credentials.yaml` (gitignored) and fill in real
# entries. Real credential VALUES never live in this file — only metadata.
# Token / password / key material lives in the secret store referenced by
# `secret_ref`.
#
# Schema (per credential entry):
#
#   id              required, string. Stable identifier; appears in alert
#                   bodies and in the rotation runbook. Use kebab-case,
#                   prefix with type for grep-ability (e.g.
#                   `jira-token-claude-bot`, `gerrit-http-codex-bot`).
#
#   type            required, one of:
#                     - jira_token        (Atlassian API token)
#                     - gerrit_http       (Gerrit HTTP password)
#                     - ssh_key           (SSH private key)
#                     - api_key           (third-party API key,
#                                          e.g. Anthropic, OpenAI)
#                     - encryption_key    (KMS / Fernet / app-level)
#
#   expiry          required. Either an ISO-8601 date (YYYY-MM-DD) for the
#                   day the credential stops working, or the literal
#                   string `never` for credentials with no policy expiry
#                   (typically ed25519 SSH keys).
#
#   last_rotated_at required, ISO-8601 date. Updated by the operator (or
#                   the rotation script per T7 runbook) immediately after
#                   each rotation. Used for audit + drift detection.
#
#   owner           required, string. Person or team responsible for
#                   rotation. Use a routable handle — Slack `@user`,
#                   email, or PagerDuty escalation policy name.
#
#   runbook         optional, string. Path or anchor pointing at the T7
#                   rotation runbook section for this credential type.
#                   Defaults to the type-level section in
#                   `docs/operations/credential_rotation_runbook.md`.
#
#   secret_ref      optional, string. Pointer to where the actual
#                   credential VALUE lives (env var, vault path, DB row).
#                   Never put the value itself here.
#
#   notes           optional, free text. Anything an operator at 3 a.m.
#                   should know — e.g. "rotation requires SSO admin",
#                   "shared with vendor X, coordinate via ticket Y".
#
# Validation: `scripts/credential_expiry_check.py --validate` rejects
# unknown types, missing required fields, and malformed dates. Run it
# in CI to keep the inventory honest.

credentials:
  # ── JIRA tokens (Atlassian Cloud, configurable max-age policy) ──
  - id: jira-token-claude-bot
    type: jira_token
    expiry: 2026-11-04
    last_rotated_at: 2026-05-04
    owner: "@platform-team"
    runbook: docs/operations/credential_rotation_runbook.md#jira-tokens
    secret_ref: "env:JIRA_TOKEN_CLAUDE_BOT"
    notes: "Atlassian admin must approve rotation; SSO-bound."

  - id: jira-token-codex-bot
    type: jira_token
    expiry: 2026-11-04
    last_rotated_at: 2026-05-04
    owner: "@platform-team"
    runbook: docs/operations/credential_rotation_runbook.md#jira-tokens
    secret_ref: "env:JIRA_TOKEN_CODEX_BOT"

  # ── Gerrit HTTP passwords (self-hosted, 90-day rotation policy) ──
  - id: gerrit-http-claude-bot
    type: gerrit_http
    expiry: 2026-08-05
    last_rotated_at: 2026-05-07
    owner: "@platform-team"
    runbook: docs/operations/credential_rotation_runbook.md#gerrit-http-passwords
    secret_ref: "db:git_accounts.encrypted_token[claude-bot]"
    notes: "Tested 2026-05-07 — silently expired in prior session, root cause for OP-727."

  - id: gerrit-http-codex-bot
    type: gerrit_http
    expiry: 2026-08-05
    last_rotated_at: 2026-05-07
    owner: "@platform-team"
    runbook: docs/operations/credential_rotation_runbook.md#gerrit-http-passwords
    secret_ref: "db:git_accounts.encrypted_token[codex-bot]"

  - id: gerrit-http-merger-bot
    type: gerrit_http
    expiry: 2026-08-05
    last_rotated_at: 2026-05-07
    owner: "@platform-team"
    runbook: docs/operations/credential_rotation_runbook.md#gerrit-http-passwords
    secret_ref: "db:git_accounts.encrypted_token[merger-agent-bot]"
    notes: "Used by O6 merger to push +2 conflict-resolution patchsets."

  # ── SSH keys (ed25519, no policy expiry) ─────────────────────────
  - id: ssh-key-claude-bot
    type: ssh_key
    expiry: never
    last_rotated_at: 2026-04-12
    owner: "@platform-team"
    runbook: docs/operations/credential_rotation_runbook.md#ssh-keys
    secret_ref: "file:~/.ssh/id_ed25519_claude_bot"
    notes: "ed25519 — no policy expiry, but rotate on suspected compromise."

  - id: ssh-key-codex-bot
    type: ssh_key
    expiry: never
    last_rotated_at: 2026-04-12
    owner: "@platform-team"
    runbook: docs/operations/credential_rotation_runbook.md#ssh-keys
    secret_ref: "file:~/.ssh/id_ed25519_codex_bot"

  # ── Third-party API keys ─────────────────────────────────────────
  - id: api-key-anthropic-prod
    type: api_key
    expiry: 2027-01-15
    last_rotated_at: 2026-01-15
    owner: "@ai-platform-lead"
    runbook: docs/operations/credential_rotation_runbook.md#api-keys
    secret_ref: "env:ANTHROPIC_API_KEY"
    notes: "Console-issued; rotation requires console admin login."

  - id: api-key-openai-prod
    type: api_key
    expiry: 2027-01-15
    last_rotated_at: 2026-01-15
    owner: "@ai-platform-lead"
    runbook: docs/operations/credential_rotation_runbook.md#api-keys
    secret_ref: "env:OPENAI_API_KEY"

  # ── Encryption keys (Fernet, application-level) ──────────────────
  - id: encryption-key-credential-vault
    type: encryption_key
    expiry: 2027-05-01
    last_rotated_at: 2026-05-01
    owner: "@security-team"
    runbook: docs/operations/credential_rotation_runbook.md#encryption-keys
    secret_ref: "env:OMNISIGHT_VAULT_FERNET_KEY"
    notes: "Annual rotation. Re-encryption migration required (alembic 0029)."

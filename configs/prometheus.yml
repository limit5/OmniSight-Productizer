# Phase 52 — Prometheus scrape config for OmniSight backend.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/obs-rules/project_state_health.yml

# OP-2563 — fan firing alerts out to Alertmanager (compose service
# `alertmanager`, observability profile) so they page instead of only
# surfacing in /api/v1/alerts.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: omnisight-backend
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["backend-a:8000", "backend-b:8001"]

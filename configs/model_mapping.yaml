# BP.F.3 operator-editable model mapping.
#
# Operators may change provider default_model values, per-Guild model_spec
# values, and specialist model_spec values in this file without a code change.
# Backend readers load it from configs/model_mapping.yaml at runtime and
# invalidate their mtime caches after the file changes; keep the existing
# provider:model syntax so the BP.F guardrails and A2A AgentCards agree.

version: 1
mode: advisory


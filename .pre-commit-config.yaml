repos:
  - repo: local
    hooks:
      - id: omnisight-gitleaks
        name: OmniSight gitleaks secret scan
        entry: python3 -m backend.security_scanning.secrets --app-path . --scanner gitleaks
        language: system
        pass_filenames: false
        always_run: true
      - id: omnisight-trufflehog
        name: OmniSight trufflehog secret scan
        entry: python3 -m backend.security_scanning.secrets --app-path . --scanner trufflehog
        language: system
        pass_filenames: false
        always_run: true
      - id: omnisight-alembic-downgrade
        name: OmniSight alembic — reject silent downgrade=pass (FX.7.6)
        entry: python3 scripts/check_alembic_downgrade.py
        language: system
        files: ^backend/alembic/versions/.*\.py$
        pass_filenames: true
      - id: omnisight-generated-docs-not-staged
        name: OmniSight generated docs are not staged
        entry: >
          bash -c 'blocked_paths="docs/adr/README.md docs/sop/lessons-learned.md docs/status/handoff_status.yaml";
          staged="$(git diff --cached --name-only --diff-filter=ACMR -- $blocked_paths)";
          if [ -n "$staged" ]; then
            printf "%s\n" "Generated files must not be staged:" "$staged" >&2;
            exit 1;
          fi'
        language: system
        pass_filenames: false
        always_run: true
      - id: omnisight-jira-ticket-spec-devops-activation
        name: OmniSight JIRA ticket specs validate labels and devops activation AC
        entry: python3 scripts/lint-jira-ticket-spec.py
        language: system
        files: ^(.*jira.*ticket.*\.(md|txt|ya?ml)|.*ticket.*spec.*\.(py|md|txt|ya?ml))$
        pass_filenames: true
      - id: omnisight-systemd-service-directives
        name: OmniSight new systemd services require startup directives
        entry: python3 scripts/check_systemd_service_directives.py
        language: system
        files: \.service$
        pass_filenames: true

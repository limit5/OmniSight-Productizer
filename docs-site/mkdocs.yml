site_name: OmniSight Docs
site_description: SOPs, ADRs, lessons, runbooks, and operations reference for OmniSight.
site_url: https://docs.sora.services/
site_author: OmniSight team
copyright: Copyright &copy; OmniSight

docs_dir: docs
site_dir: ../docs-site-dist

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - SOPs:
      - sop/index.md
      - JIRA ticket conventions: sop/jira-ticket-conventions.md
  - ADRs:
      - adr/index.md
      - "ADR-0001 Five-branch Git Flow": adr/0001-five-branch-gitflow.md
  - Lessons:
      - lessons/index.md
      - "L-OP-15 Codex feature branches": lessons/L-OP-15-codex-feature-branches.md
  - Runbooks:
      - runbook/index.md
  - Operations:
      - operations/index.md

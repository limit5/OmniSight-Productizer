workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - when: never

stages:
  - build
  - sign
  - sbom
  - attest
  - audit-emit

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: plain
  COSIGN_VERSION: v2.4.1
  SYFT_VERSION: v1.17.0
  IMAGE_TAG_SHA: "sha-${CI_COMMIT_SHORT_SHA}"

.tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'

.docker_job:
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--tls=false"]
  before_script:
    - set -euo pipefail
    - apk add --no-cache bash ca-certificates coreutils curl jq
    - echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" --username "gitlab-ci-token" --password-stdin

.image_matrix:
  parallel:
    matrix:
      - IMAGE_NAME: backend
        DOCKERFILE: Dockerfile.backend
      - IMAGE_NAME: frontend
        DOCKERFILE: Dockerfile.frontend
      - IMAGE_NAME: bridge
        DOCKERFILE: Dockerfile.bridge

# OP-1513 / OP-1478-act-T1.3 — populate bundle.json before image builds
# so Dockerfile.{backend,frontend,bridge} can COPY it into /app and stamp
# the OCI bundle id/sha labels. Real per-image digests do not exist until
# build-image pushes — we use schema-valid placeholder digests here and
# leave the post-build re-seal with real digests to the existing
# bundle-manifest workflow. The identity fields (bundle_id, git_sha,
# git_ref, contracts) are real and ARE what the audit-emit assert checks.
prepare-bundle:
  extends:
    - .tag_rules
  stage: build
  image: docker:27.3.1
  before_script:
    - set -euo pipefail
    - apk add --no-cache bash python3 jq git coreutils
  script:
    - export GIT_SHA="${CI_COMMIT_SHA}"
    - export GIT_REF="refs/tags/${CI_COMMIT_TAG}"
    - export OPENAPI_HASH="$(sha256sum openapi.json | awk '{print $1}')"
    - export API_REQUIRED="${API_REQUIRED:-v1}"
    - export API_SUPPORTED="${API_SUPPORTED:-v1,v2}"
    - export FRONTEND_BUILT_AGAINST_API="${FRONTEND_BUILT_AGAINST_API:-v1}"
    - export DB_MIGRATION_HEAD="${DB_MIGRATION_HEAD:-unknown}"
    - placeholder_digest="sha256:$(python3 -c 'print("0"*64)')"
    - export IMAGE_DIGEST_BACKEND="$placeholder_digest"
    - export IMAGE_DIGEST_FRONTEND="$placeholder_digest"
    - export IMAGE_DIGEST_BRIDGE="$placeholder_digest"
    - bash scripts/emit_bundle_json.sh > bundle.json
    - BUNDLE_ID="$(jq -r '.bundle_id' bundle.json)"
    - BUNDLE_SHA="$(sha256sum bundle.json | awk '{print $1}')"
    - test -n "$BUNDLE_ID" && test "$BUNDLE_ID" != "null"
    - test -n "$BUNDLE_SHA"
    - printf 'BUNDLE_ID=%s\nBUNDLE_SHA=%s\n' "$BUNDLE_ID" "$BUNDLE_SHA" > bundle.env
    - echo "prepared bundle_id=$BUNDLE_ID bundle_sha=$BUNDLE_SHA"
  artifacts:
    name: "bundle-${CI_COMMIT_TAG}"
    paths:
      - bundle.json
    reports:
      dotenv: bundle.env
    expire_in: 90 days

build-image:
  extends:
    - .docker_job
    - .image_matrix
    - .tag_rules
  stage: build
  needs:
    - job: prepare-bundle
      artifacts: true
  timeout: 90m
  script:
    - docker buildx create --use --name "omnisight-${CI_PIPELINE_ID}-${IMAGE_NAME}"
    - docker buildx inspect --bootstrap
    - IMAGE_BASE="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}"
    - test -f bundle.json
    - test -n "${BUNDLE_ID}" && test -n "${BUNDLE_SHA}"
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --push \
        --file "${DOCKERFILE}" \
        --build-arg "BUNDLE_ID=${BUNDLE_ID}" \
        --build-arg "BUNDLE_SHA=${BUNDLE_SHA}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.version=${CI_COMMIT_TAG}" \
        --label "org.opencontainers.image.created=${CI_PIPELINE_CREATED_AT}" \
        --label "org.opencontainers.image.bundle.id=${BUNDLE_ID}" \
        --label "org.opencontainers.image.bundle.sha=${BUNDLE_SHA}" \
        --tag "${IMAGE_BASE}:${CI_COMMIT_TAG}" \
        --tag "${IMAGE_BASE}:${IMAGE_TAG_SHA}" \
        --tag "${IMAGE_BASE}:latest" \
        .

.cosign_job:
  extends:
    - .docker_job
    - .image_matrix
    - .tag_rules
  before_script:
    - set -euo pipefail
    - apk add --no-cache bash ca-certificates coreutils curl jq
    - echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" --username "gitlab-ci-token" --password-stdin
    - curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
  variables:
    COSIGN_YES: "true"

sign-image:
  extends: .cosign_job
  stage: sign
  needs:
    - build-image
  script:
    - IMAGE_BASE="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}"
    - DIGEST="$(docker buildx imagetools inspect "${IMAGE_BASE}:${IMAGE_TAG_SHA}" --format '{{json .Manifest.Digest}}' | jq -r .)"
    - test -n "$DIGEST"
    - IMAGE_REF="${IMAGE_BASE}@${DIGEST}"
    - cosign sign --yes --key "$COSIGN_KEY" "$IMAGE_REF"
    - |
      cosign verify \
        --key deploy/cosign/cosign.pub \
        "$IMAGE_REF" >/dev/null

sbom-image:
  extends:
    - .docker_job
    - .image_matrix
    - .tag_rules
  stage: sbom
  needs:
    - sign-image
  script:
    - curl -sSfL "https://raw.githubusercontent.com/anchore/syft/main/install.sh" | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
    - IMAGE_BASE="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}"
    - DIGEST="$(docker buildx imagetools inspect "${IMAGE_BASE}:${IMAGE_TAG_SHA}" --format '{{json .Manifest.Digest}}' | jq -r .)"
    - test -n "$DIGEST"
    - syft "${IMAGE_BASE}@${DIGEST}" -o cyclonedx-json="sbom-${IMAGE_NAME}.cdx.json"
  artifacts:
    name: "image-sbom-${IMAGE_NAME}"
    paths:
      - "sbom-${IMAGE_NAME}.cdx.json"
    expire_in: 90 days

attest-image:
  extends: .cosign_job
  stage: attest
  needs:
    - sbom-image
  script:
    - IMAGE_BASE="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}"
    - DIGEST="$(docker buildx imagetools inspect "${IMAGE_BASE}:${IMAGE_TAG_SHA}" --format '{{json .Manifest.Digest}}' | jq -r .)"
    - test -n "$DIGEST"
    - IMAGE_REF="${IMAGE_BASE}@${DIGEST}"
    - |
      jq -n \
        --arg image "$IMAGE_NAME" \
        --arg image_ref "$IMAGE_REF" \
        --arg digest "$DIGEST" \
        --arg git_sha "$CI_COMMIT_SHA" \
        --arg git_ref "$CI_COMMIT_REF_NAME" \
        --arg pipeline_url "$CI_PIPELINE_URL" \
        '{
          image: $image,
          image_ref: $image_ref,
          digest: $digest,
          git_sha: $git_sha,
          git_ref: $git_ref,
          pipeline_url: $pipeline_url,
          builder: "gitlab-ci"
        }' > "attestation-${IMAGE_NAME}.json"
    - cosign attest --yes --key "$COSIGN_KEY" --predicate "attestation-${IMAGE_NAME}.json" --type "https://in-toto.io/Statement/v1" "$IMAGE_REF"
  artifacts:
    name: "image-attestation-${IMAGE_NAME}"
    paths:
      - "attestation-${IMAGE_NAME}.json"
    expire_in: 90 days

# OP-1513 AC #4 — guard against the stub bundle.json shape
# ({"bundle_id": "local-dev", "git_sha": "000...", ...}) ever shipping.
# Checks the prepare-bundle artifact (which is what was COPYed into the
# image at build time, so a pass here proves /app/bundle.json carries the
# real identity).
bundle-assert:
  extends:
    - .tag_rules
  stage: audit-emit
  image: alpine:3.19
  needs:
    - job: prepare-bundle
      artifacts: true
  before_script:
    - set -euo pipefail
    - apk add --no-cache jq
  script:
    - test -f bundle.json || (echo "bundle.json artifact missing"; exit 1)
    - bundle_id="$(jq -r '.bundle_id' bundle.json)"
    - git_sha="$(jq -r '.git_sha' bundle.json)"
    - build_time="$(jq -r '.build_time' bundle.json)"
    - echo "asserting bundle_id=$bundle_id git_sha=$git_sha build_time=$build_time"
    - |
      if [ "$bundle_id" = "local-dev" ] || [ "$bundle_id" = "null" ] || [ -z "$bundle_id" ]; then
        echo "FAIL: bundle.json bundle_id is stub ('local-dev'/null/empty): '$bundle_id'"
        exit 1
      fi
    - |
      if [ "$git_sha" = "0000000000000000000000000000000000000000" ]; then
        echo "FAIL: bundle.json git_sha is the 40-zero stub"
        exit 1
      fi
    - |
      if [ "$build_time" = "1970-01-01T00:00:00Z" ]; then
        echo "FAIL: bundle.json build_time is the epoch stub"
        exit 1
      fi
    - echo "bundle.json identity fields are real — assertion passed"

audit-emit:
  extends:
    - .docker_job
    - .image_matrix
    - .tag_rules
  stage: audit-emit
  needs:
    - attest-image
  script:
    - IMAGE_BASE="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}"
    - DIGEST="$(docker buildx imagetools inspect "${IMAGE_BASE}:${IMAGE_TAG_SHA}" --format '{{json .Manifest.Digest}}' | jq -r .)"
    - test -n "$DIGEST"
    - |
      jq -n \
        --arg event "image.signed_pushed" \
        --arg image "$IMAGE_NAME" \
        --arg registry "$CI_REGISTRY" \
        --arg image_ref "${IMAGE_BASE}@${DIGEST}" \
        --arg digest "$DIGEST" \
        --arg git_sha "$CI_COMMIT_SHA" \
        --arg git_ref "$CI_COMMIT_REF_NAME" \
        --arg version "$CI_COMMIT_TAG" \
        --arg actor "$GITLAB_USER_LOGIN" \
        --arg run_id "$CI_PIPELINE_ID" \
        --arg run_url "$CI_PIPELINE_URL" \
        --arg cosign_version "$COSIGN_VERSION" \
        '{
          event: $event,
          image: $image,
          registry: $registry,
          image_ref: $image_ref,
          digest: $digest,
          git_sha: $git_sha,
          git_ref: $git_ref,
          is_release: "true",
          version: $version,
          actor: $actor,
          run_id: $run_id,
          run_url: $run_url,
          signed_with: "cosign-keyless-gitlab-oidc",
          cosign_version: $cosign_version
        }' > "image-audit-${IMAGE_NAME}.json"
  artifacts:
    name: "image-audit-${IMAGE_NAME}"
    paths:
      - "image-audit-${IMAGE_NAME}.json"
    expire_in: 90 days
